<svg width="1160" height="400" viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg"><text x="0" y="16" fill="#94A3B8" font-size="14">左边是分层，右边是 AI 干活的三条固定链路</text><g><rect x="0" y="30" width="540" height="56" rx="8" fill="#151B33" stroke="#334155" /><text x="18" y="56" fill="#FFFFFF" font-size="16" font-weight="bold">界面层 · React 18 + TypeScript</text><text x="18" y="76" fill="#94A3B8" font-size="13">今日 / 收集箱 / 草稿箱 / 日历 / 知识库 / 搜索 / 信息流 / 图谱</text><rect x="0" y="96" width="540" height="56" rx="8" fill="#151B33" stroke="#334155" /><text x="18" y="122" fill="#FFFFFF" font-size="16" font-weight="bold">应用层 · src/core（与界面解耦）</text><text x="18" y="142" fill="#94A3B8" font-size="13">ai 编排　search 检索　repo 存储　sync 同步　aggregator 镜像</text><rect x="0" y="162" width="540" height="56" rx="8" fill="#151B33" stroke="#4F46E5" stroke-dasharray="6 4" /><text x="18" y="188" fill="#FFFFFF" font-size="16" font-weight="bold">云端 AI（可选 · 可断开）</text><text x="18" y="208" fill="#94A3B8" font-size="13">DeepSeek / Ollama / 自定义，走 OpenAI 兼容协议 —— 换模型只改地址</text><rect x="0" y="228" width="540" height="56" rx="8" fill="#151B33" stroke="#334155" /><text x="18" y="254" fill="#FFFFFF" font-size="16" font-weight="bold">本地 AI（离线也能跑）</text><text x="18" y="274" fill="#94A3B8" font-size="13">transformers.js + bge-small-zh 向量　tesseract OCR　规则兜底</text><rect x="0" y="294" width="540" height="56" rx="8" fill="#151B33" stroke="#334155" /><text x="18" y="320" fill="#FFFFFF" font-size="16" font-weight="bold">本地存储</text><text x="18" y="340" fill="#94A3B8" font-size="13">IndexedDB（Dexie v1→v4）· OPFS · 向量 512 维</text><rect x="0" y="360" width="540" height="40" rx="8" fill="#151B33" stroke="#334155" /><text x="18" y="385" fill="#94A3B8" font-size="13">桌面壳 Rust 484 行（通知 / 托盘 / 悬浮窗）　聚合服务 Python（调度 → 抓取 → 去重 → 补正文）</text></g><g><rect x="580" y="30" width="70" height="80" rx="8" fill="#4F46E5" /><text x="615" y="76" fill="#FFFFFF" font-size="17" font-weight="bold" text-anchor="middle">理解</text><rect x="664" y="30" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="736" y="62" fill="#E2E8F0" font-size="14" text-anchor="middle">粘贴一段话</text><text x="736" y="86" fill="#94A3B8" font-size="12" text-anchor="middle">472 字通知</text><path d="M815 70 L829 70" stroke="#475569" stroke-width="2" /><rect x="833" y="30" width="145" height="80" rx="8" fill="#151B33" stroke="#4F46E5" /><text x="905" y="62" fill="#FFFFFF" font-size="14" text-anchor="middle">模型输出 JSON</text><text x="905" y="86" fill="#94A3B8" font-size="12" text-anchor="middle">校验 + 字段兜底</text><path d="M984 70 L998 70" stroke="#475569" stroke-width="2" /><rect x="1002" y="30" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="1074" y="62" fill="#E2E8F0" font-size="14" text-anchor="middle">进草稿箱</text><text x="1074" y="86" fill="#94A3B8" font-size="12" text-anchor="middle">你确认才入库</text><rect x="580" y="150" width="70" height="80" rx="8" fill="#22D3EE" /><text x="615" y="196" fill="#0B1020" font-size="17" font-weight="bold" text-anchor="middle">检索</text><rect x="664" y="150" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="736" y="182" fill="#E2E8F0" font-size="14" text-anchor="middle">问一句人话</text><text x="736" y="206" fill="#94A3B8" font-size="12" text-anchor="middle">选课通知说了什么</text><path d="M815 190 L829 190" stroke="#475569" stroke-width="2" /><rect x="833" y="150" width="145" height="80" rx="8" fill="#151B33" stroke="#22D3EE" /><text x="905" y="182" fill="#FFFFFF" font-size="14" text-anchor="middle">本地执行检索</text><text x="905" y="206" fill="#94A3B8" font-size="12" text-anchor="middle">全文 + 向量 + 范围</text><path d="M984 190 L998 190" stroke="#475569" stroke-width="2" /><rect x="1002" y="150" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="1074" y="182" fill="#E2E8F0" font-size="14" text-anchor="middle">总结成答案</text><text x="1074" y="206" fill="#94A3B8" font-size="12" text-anchor="middle">带 [1][2] 引用</text><rect x="580" y="270" width="70" height="80" rx="8" fill="#F0ABFC" /><text x="615" y="316" fill="#0B1020" font-size="17" font-weight="bold" text-anchor="middle">聚合</text><rect x="664" y="270" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="736" y="302" fill="#E2E8F0" font-size="14" text-anchor="middle">到点了自己抓</text><text x="736" y="326" fill="#94A3B8" font-size="12" text-anchor="middle">robots · 限速 · 304</text><path d="M815 310 L829 310" stroke="#475569" stroke-width="2" /><rect x="833" y="270" width="145" height="80" rx="8" fill="#151B33" stroke="#334155" /><text x="905" y="302" fill="#E2E8F0" font-size="14" text-anchor="middle">去重 + 存库</text><text x="905" y="326" fill="#94A3B8" font-size="12" text-anchor="middle">guid / url / 内容哈希</text><path d="M984 310 L998 310" stroke="#475569" stroke-width="2" /><rect x="1002" y="270" width="145" height="80" rx="8" fill="#151B33" stroke="#F0ABFC" /><text x="1074" y="302" fill="#E2E8F0" font-size="14" text-anchor="middle">补正文进索引</text><text x="1074" y="326" fill="#94A3B8" font-size="12" text-anchor="middle">于是搜得到正文</text></g></svg>