<svg width="1160" height="430" viewBox="0 0 1160 430" xmlns="http://www.w3.org/2000/svg"><g><rect x="0" y="0" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="0" y="0" width="4" height="126" rx="2" fill="#22D3EE" /><text x="24" y="36" fill="#22D3EE" font-size="20" font-weight="bold">①</text><text x="56" y="37" fill="#FFFFFF" font-size="19" font-weight="bold">今日</text><text x="24" y="66" fill="#94A3B8" font-size="14">打开就知道今天要做什么</text><text x="24" y="90" fill="#94A3B8" font-size="14">日 / 周 / 月视图，看得到截止</text><text x="24" y="112" fill="#64748B" font-size="13">→ 起床第一眼</text><rect x="294" y="0" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="294" y="0" width="4" height="126" rx="2" fill="#4F46E5" /><text x="318" y="36" fill="#4F46E5" font-size="20" font-weight="bold">②</text><text x="350" y="37" fill="#FFFFFF" font-size="19" font-weight="bold">收集箱</text><text x="318" y="66" fill="#94A3B8" font-size="14">想到就扔进去，先存后整理</text><text x="318" y="90" fill="#94A3B8" font-size="14">文字 / 截图 / 文件都收</text><text x="318" y="112" fill="#64748B" font-size="13">→ 记录门槛最低的一处</text><rect x="588" y="0" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="588" y="0" width="4" height="126" rx="2" fill="#4F46E5" /><text x="612" y="36" fill="#4F46E5" font-size="20" font-weight="bold">③</text><text x="644" y="37" fill="#FFFFFF" font-size="19" font-weight="bold">AI 解析 · 草稿箱</text><text x="612" y="66" fill="#94A3B8" font-size="14">一段话 → 多条带时间地点的条目</text><text x="612" y="90" fill="#94A3B8" font-size="14">你确认后才进正式数据</text><text x="612" y="112" fill="#64748B" font-size="13">→ 省掉手打</text><rect x="882" y="0" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="882" y="0" width="4" height="126" rx="2" fill="#4F46E5" /><text x="906" y="36" fill="#4F46E5" font-size="20" font-weight="bold">④</text><text x="938" y="37" fill="#FFFFFF" font-size="19" font-weight="bold">日历</text><text x="906" y="66" fill="#94A3B8" font-size="14">确认后的条目落在时间轴上</text><text x="906" y="90" fill="#94A3B8" font-size="14">桌面到点弹系统通知</text><text x="906" y="112" fill="#64748B" font-size="13">→ 知道什么时候该做</text></g><g><rect x="0" y="146" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="0" y="146" width="4" height="126" rx="2" fill="#22D3EE" /><text x="24" y="182" fill="#22D3EE" font-size="20" font-weight="bold">⑤</text><text x="56" y="183" fill="#FFFFFF" font-size="19" font-weight="bold">知识库 · 附件</text><text x="24" y="212" fill="#94A3B8" font-size="14">笔记与日程双向链接</text><text x="24" y="236" fill="#94A3B8" font-size="14">PDF/Word/图片正文进索引</text><text x="24" y="258" fill="#64748B" font-size="13">→ 文件里的字也搜得到</text><rect x="294" y="146" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="294" y="146" width="4" height="126" rx="2" fill="#22D3EE" /><text x="318" y="182" fill="#22D3EE" font-size="20" font-weight="bold">⑥</text><text x="350" y="183" fill="#FFFFFF" font-size="19" font-weight="bold">搜索（三种）</text><text x="318" y="212" fill="#94A3B8" font-size="14">全文 / 语义 / 问答</text><text x="318" y="236" fill="#94A3B8" font-size="14">可勾范围，问答带引用</text><text x="318" y="258" fill="#64748B" font-size="13">→ 忘了原话也能找回来</text><rect x="588" y="146" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="588" y="146" width="4" height="126" rx="2" fill="#F0ABFC" /><text x="612" y="182" fill="#F0ABFC" font-size="20" font-weight="bold">⑦</text><text x="644" y="183" fill="#FFFFFF" font-size="19" font-weight="bold">信息流</text><text x="612" y="212" fill="#94A3B8" font-size="14">给个网址就自动订阅并抓正文</text><text x="612" y="236" fill="#94A3B8" font-size="14">点标题出 AI 摘要 / 显示原文</text><text x="612" y="258" fill="#64748B" font-size="13">→ 不用挨个开网站</text><rect x="882" y="146" width="278" height="126" rx="10" fill="#151B33" stroke="#334155" /><rect x="882" y="146" width="4" height="126" rx="2" fill="#F0ABFC" /><text x="906" y="182" fill="#F0ABFC" font-size="20" font-weight="bold">⑧</text><text x="938" y="183" fill="#FFFFFF" font-size="19" font-weight="bold">数据 · 多端 · 提醒</text><text x="906" y="212" fill="#94A3B8" font-size="14">一键导出 / 备份 / 同步</text><text x="906" y="236" fill="#94A3B8" font-size="14">托盘 · 悬浮窗 · 快捷键</text><text x="906" y="258" fill="#64748B" font-size="13">→ 换设备、随手记</text></g><g><rect x="0" y="300" width="1160" height="110" rx="10" fill="#151B33" stroke="#334155" /><text x="28" y="334" fill="#FFFFFF" font-size="18" font-weight="bold">贯穿全程的三件事</text><text x="28" y="362" fill="#94A3B8" font-size="14">· AI 只写草稿</text><text x="28" y="386" fill="#64748B" font-size="13">— 任何解析结果都必须你点确认才写入正式数据</text><text x="400" y="362" fill="#94A3B8" font-size="14">· 数据在你自己设备上</text><text x="400" y="386" fill="#64748B" font-size="13">— 没有账号、没有服务器，一键导出就是你的文件</text><text x="790" y="362" fill="#94A3B8" font-size="14">· 断网也能用</text><text x="790" y="386" fill="#64748B" font-size="13">— AI 与同步是开关，关掉只剩本地功能，一样完整</text></g></svg>