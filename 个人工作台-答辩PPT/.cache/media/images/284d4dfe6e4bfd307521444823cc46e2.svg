<svg width="1160" height="400" viewBox="0 0 1160 400" xmlns="http://www.w3.org/2000/svg"><g><rect x="0" y="0" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="24" y="34" fill="#22D3EE" font-size="16" font-weight="bold">解析一条通知</text><text x="24" y="74" fill="#FFFFFF" font-size="30" font-weight="bold">472 字 → 9 条</text><text x="24" y="108" fill="#94A3B8" font-size="14">手打这 9 条约 5 分钟</text><text x="24" y="132" fill="#94A3B8" font-size="14">现在：粘贴 + 点确认，约 20 秒</text><text x="24" y="160" fill="#64748B" font-size="13">成本 ¥0.0026 / 次（DeepSeek 空闲时段）</text><rect x="394" y="0" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="418" y="34" fill="#22D3EE" font-size="16" font-weight="bold">检索</text><text x="418" y="74" fill="#FFFFFF" font-size="30" font-weight="bold">毫秒级</text><text x="418" y="108" fill="#94A3B8" font-size="14">全文 / 语义检索都是毫秒级</text><text x="418" y="132" fill="#94A3B8" font-size="14">本地向量模型首次加载 1.2 秒</text><text x="418" y="160" fill="#64748B" font-size="13">语义命中相似度 51%–56%（83 条索引）</text><rect x="788" y="0" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="812" y="34" fill="#22D3EE" font-size="16" font-weight="bold">问答一次</text><text x="812" y="74" fill="#FFFFFF" font-size="30" font-weight="bold">2–5 秒</text><text x="812" y="108" fill="#94A3B8" font-size="14">真实 Key 下：1 条直接命中 + 3 条引用</text><text x="812" y="132" fill="#94A3B8" font-size="14">答案带 [1][2]，点开可核对</text><text x="812" y="160" fill="#64748B" font-size="13">成本 ¥0.0045 / 次（两次模型调用）</text></g><g><rect x="0" y="196" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="24" y="230" fill="#F0ABFC" font-size="16" font-weight="bold">信息流</text><text x="24" y="270" fill="#FFFFFF" font-size="30" font-weight="bold">60 / 75 条有正文</text><text x="24" y="304" fill="#94A3B8" font-size="14">5 个来源 · 共 8.3 万字 · 平均 1,447 字</text><text x="24" y="330" fill="#64748B" font-size="13">RSS 源零额外请求；网页源每域名间隔 1.5 秒</text><text x="24" y="352" fill="#64748B" font-size="13">补抓 62 条约 2 分钟，之后新条目自动补</text><rect x="394" y="196" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="418" y="230" fill="#F0ABFC" font-size="16" font-weight="bold">代码量</text><text x="418" y="270" fill="#FFFFFF" font-size="30" font-weight="bold">20,849 行</text><text x="418" y="304" fill="#94A3B8" font-size="14">TS/TSX 15,173 · Rust 484 · Python 5,192</text><text x="418" y="330" fill="#64748B" font-size="13">运行时依赖 17 个，自检脚本 66 项全通过</text><text x="418" y="352" fill="#64748B" font-size="13">安装包 27MB，常驻内存 34MB</text><rect x="788" y="196" width="372" height="180" rx="10" fill="#151B33" stroke="#334155" /><text x="812" y="230" fill="#F0ABFC" font-size="16" font-weight="bold">每月花多少</text><text x="812" y="270" fill="#FFFFFF" font-size="30" font-weight="bold">≈ ¥3 / 月</text><text x="812" y="304" fill="#94A3B8" font-size="14">按每天 20 次解析 + 10 次问答算</text><text x="812" y="330" fill="#64748B" font-size="13">关掉云端 = ¥0：全部走本地规则与本地向量</text><text x="812" y="352" fill="#64748B" font-size="13">语义搜索默认关，装了才占 25MB</text></g></svg>