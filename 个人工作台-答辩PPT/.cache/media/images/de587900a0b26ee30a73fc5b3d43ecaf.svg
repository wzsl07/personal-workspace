<svg width="1160" height="330" viewBox="0 0 1160 330" xmlns="http://www.w3.org/2000/svg"><text x="0" y="20" fill="#94A3B8" font-size="15">顺时针走一遍：记录 → 理解 → 落地 → 提醒 → 找回 → 自动收</text><g><rect x="0" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#334155" /><text x="16" y="68" fill="#22D3EE" font-size="15" font-weight="bold">01 · 早上 8:00</text><text x="16" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">打开「今日」</text><text x="16" y="120" fill="#94A3B8" font-size="13">今天/本周要做什么</text><text x="16" y="142" fill="#64748B" font-size="13">一眼看完，不用翻</text><path d="M158 99 L172 99" stroke="#475569" stroke-width="2" /><path d="M166 93 L172 99 L166 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="168" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#4F46E5" /><text x="184" y="68" fill="#22D3EE" font-size="15" font-weight="bold">02 · 收到通知</text><text x="184" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">粘进收集箱</text><text x="184" y="120" fill="#94A3B8" font-size="13">不用管格式</text><text x="184" y="142" fill="#64748B" font-size="13">想到什么写什么</text><path d="M326 99 L340 99" stroke="#475569" stroke-width="2" /><path d="M334 93 L340 99 L334 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="336" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#4F46E5" /><text x="352" y="68" fill="#22D3EE" font-size="15" font-weight="bold">03 · AI 帮你看</text><text x="352" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">拆成 9 条</text><text x="352" y="120" fill="#94A3B8" font-size="13">时间/地点/优先级</text><text x="352" y="142" fill="#64748B" font-size="13">没把握的标黄</text><path d="M494 99 L508 99" stroke="#475569" stroke-width="2" /><path d="M502 93 L508 99 L502 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="504" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#334155" /><text x="520" y="68" fill="#22D3EE" font-size="15" font-weight="bold">04 · 你点确认</text><text x="520" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">进草稿箱等你</text><text x="520" y="120" fill="#94A3B8" font-size="13">左右对照着改</text><text x="520" y="142" fill="#64748B" font-size="13">不确认就不入库</text><path d="M662 99 L676 99" stroke="#475569" stroke-width="2" /><path d="M670 93 L676 99 L670 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="672" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#334155" /><text x="688" y="68" fill="#22D3EE" font-size="15" font-weight="bold">05 · 进日历</text><text x="688" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">到点提醒你</text><text x="688" y="120" fill="#94A3B8" font-size="13">系统通知 / 托盘</text><text x="688" y="142" fill="#64748B" font-size="13">不用一直盯着</text><path d="M830 99 L844 99" stroke="#475569" stroke-width="2" /><path d="M838 93 L844 99 L838 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="840" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#22D3EE" /><text x="856" y="68" fill="#22D3EE" font-size="15" font-weight="bold">06 · 想找东西</text><text x="856" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">三种检索</text><text x="856" y="120" fill="#94A3B8" font-size="13">连订阅正文一起</text><text x="856" y="142" fill="#64748B" font-size="13">忘了原话也能找到</text><path d="M998 99 L1012 99" stroke="#475569" stroke-width="2" /><path d="M1006 93 L1012 99 L1006 105" fill="none" stroke="#475569" stroke-width="2" /><rect x="1008" y="40" width="152" height="118" rx="10" fill="#151B33" stroke="#F0ABFC" /><text x="1024" y="68" fill="#22D3EE" font-size="15" font-weight="bold">07 · 后台一直跑</text><text x="1024" y="96" fill="#FFFFFF" font-size="17" font-weight="bold">信息流自动收</text><text x="1024" y="120" fill="#94A3B8" font-size="13">订阅的站定时抓</text><text x="1024" y="142" fill="#64748B" font-size="13">醒来就有新的</text></g><g><rect x="0" y="190" width="560" height="118" rx="10" fill="#151B33" stroke="#334155" /><text x="24" y="222" fill="#FFFFFF" font-size="18" font-weight="bold">它替你做的，是"理解"和"找得到"</text><text x="24" y="252" fill="#94A3B8" font-size="14">记一条通知原本要：读一遍 → 拆出时间地点 → 手打进日历</text><text x="24" y="276" fill="#94A3B8" font-size="14">现在只需要：粘贴 → 看一眼标黄的地方 → 点确认</text><text x="24" y="298" fill="#22D3EE" font-size="14">472 字班级群消息 → 9 条结构化条目，约 20 秒</text><rect x="600" y="190" width="560" height="118" rx="10" fill="#151B33" stroke="#334155" /><text x="624" y="222" fill="#FFFFFF" font-size="18" font-weight="bold">以及"不用再挨个开网站"</text><text x="624" y="252" fill="#94A3B8" font-size="14">学院通知散在 3 个网站 → 加一次网址，之后自动抓</text><text x="624" y="276" fill="#94A3B8" font-size="14">抓来的正文进索引 → 搜"体检"能命中通知正文里的安排</text><text x="624" y="298" fill="#22D3EE" font-size="14">5 个来源 · 75 条 · 60 条有正文（8.3 万字）</text></g></svg>