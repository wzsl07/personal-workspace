[package]
name = "personal-os"
version = "0.2.0"
description = "个人工作台 · 本地优先的日程与知识库"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标（默认不启用，不加这行 tauri::tray 会找不到）
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 仅 Windows：调用 ShellExecuteW 打开网址/文件。
# 为什么不用 spawn(cmd/explorer)：那样会创建子进程，未签名的程序
# 在部分杀软（如 McAfee）下会被拦截，spawn 直接失败。
# ShellExecuteW 走的是外壳关联，跟双击文件同一条路，不创建中间进程。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
